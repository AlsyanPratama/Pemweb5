<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ruang Baca - Login</title>
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    /* Custom warna hijau sesuai gambar contoh */
    .bg-custom-green {
      background-color: #008a4b !important;
    }
    .btn-custom-green {
      background-color: #008a4b;
      color: white;
    }
    .btn-custom-green:hover {
      background-color: #006b3a;
      color: white;
    }
    .text-custom-green {
      color: #008a4b !important;
    }
  </style>
</head>
<body class="bg-light min-vh-100 d-flex flex-column">

  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg navbar-dark bg-custom-green">
    <div class="container-fluid px-4">
      <a class="navbar-brand fw-bold" href="#">Ruang Baca</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item">
            <a class="nav-link active" href="#">Beranda</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="#">Tentang</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="#">Bantuan</a>
          </li>
        </ul>
      </div>
    </div>
  </nav>

  <!-- Form Login / Main Content -->
  <div class="container my-auto py-5">
    <div class="row justify-content-center">
      <div class="col-12 col-sm-10 col-md-8 col-lg-5 col-xl-4">
        
        <!-- Card Form Login -->
        <div class="card shadow border-0 rounded-3 text-center">
          <div class="card-body p-4">
            
            <h3 class="fw-bold mb-1">Masuk ke Ruang Baca</h3>
            <p class="text-muted small mb-4">Temukan bacaan untuk hari ini.</p>

            <form>
              <!-- Input Username -->
              <div class="mb-3 text-start">
                <label for="username" class="form-label small fw-semibold text-secondary">Username</label>
                <input type="text" class="form-control" id="username" placeholder="Masukkan username">
              </div>

              <!-- Input Password -->
              <div class="mb-3 text-start">
                <label for="password" class="form-label small fw-semibold text-secondary">Password</label>
                <input type="password" class="form-control" id="password" placeholder="Masukkan password">
              </div>

              <!-- Checkbox Ingat Saya -->
              <div class="mb-4 text-start form-check">
                <input type="checkbox" class="form-check-input" id="rememberMe">
                <label class="form-check-label small text-secondary" for="rememberMe">Ingat saya</label>
              </div>

              <!-- Tombol Masuk -->
              <button type="submit" class="btn btn-custom-green w-100 py-2 fw-semibold">Masuk</button>
            </form>

          </div>

          <!-- Footer Card (Lupa Password) -->
          <div class="card-footer bg-white border-top py-3">
            <a href="#" class="text-custom-green text-decoration-none small fw-semibold">Lupa password?</a>
          </div>
        </div>

      </div>
    </div>
  </div>

  <!-- Bootstrap 5 JS Bundle -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
